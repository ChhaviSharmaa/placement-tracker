{% extends "base.html" %}

{% block content %}

<h2 class="mb-3">Students List</h2>

<!-- ONLY PLACE TO ADD STUDENT -->
<a href="/add" class="btn btn-success mb-3">+ Add Student</a>

<table class="table table-bordered table-striped shadow">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Company</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>
                <a href="/edit/{{ student[0] }}" class="btn btn-warning btn-sm">Edit</a>

                <a href="/delete/{{ student[0] }}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this student?')">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
