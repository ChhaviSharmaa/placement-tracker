{% extends "base.html" %}

{% block content %}

<h1>Dashboard</h1>

<div class="row text-center mt-4">

    <div class="col-md-4">
        <div class="card p-3 shadow">
            <h3>Total Students</h3>
            <p>{{ total }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 shadow">
            <h3>Placed Students</h3>
            <p>{{ placed }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 shadow">
            <h3>Placement Rate</h3>
            <p>{{ rate }}%</p>
        </div>
    </div>

</div>

<!-- Chart -->
<div class="mt-5">
    <canvas id="placementChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const placed = Number("{{ placed }}");
const notPlaced = Number("{{ not_placed }}");

new Chart(document.getElementById('placementChart'), {
    type: 'bar',
    data: {
        labels: ['Placed', 'Not Placed'],
        datasets: [{
            label: 'Students',
            data: [placed, notPlaced],
            borderWidth: 1
        }]
    }
});
</script>

{% endblock %}
