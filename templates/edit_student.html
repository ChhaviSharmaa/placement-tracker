{% extends "base.html" %}

{% block content %}

<h2 class="mb-3">Edit Student</h2>

<div class="card p-4 shadow">

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ student[1] }}" required>
        </div>

        <div class="mb-3">
            <label>Branch</label>
            <input type="text" name="branch" class="form-control" value="{{ student[2] }}" required>
        </div>

        <div class="mb-3">
            <label>Company</label>
            <input type="text" name="company" class="form-control" value="{{ student[3] }}">
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-control">

                <option value="Placed" {% if student[4] == 'Placed' %}selected{% endif %}>
                    Placed
                </option>

                <option value="Not Placed" {% if student[4] == 'Not Placed' %}selected{% endif %}>
                    Not Placed
                </option>

            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Student</button>
        <a href="/students" class="btn btn-secondary">Back</a>

    </form>

</div>

{% endblock %}
