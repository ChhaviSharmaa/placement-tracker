<!DOCTYPE html>
<html>
<head>
    <title>Placement System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #0d6efd;
            padding: 20px;
            color: white;
            position: fixed;
        }

        .sidebar h3 {
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 12px 0;
            font-weight: 500;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .content {
            margin-left: 240px;
            padding: 25px;
            width: 100%;
        }
    </style>
</head>

<body>

<!-- SIDEBAR (CLEAN - NO ADD DUPLICATE) -->
<div class="sidebar">
    <h3>Placement System</h3>

    <a href="/">Dashboard</a>
    <a href="/students">Students</a>
    <a href="/logout">Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
